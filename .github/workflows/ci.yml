name: CI

# Checks only. Nothing here deploys; deploying is a separate, deliberate step.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      VIDALO_MOCK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm scan:secrets
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm e2e:mock

  postgres:
    # The migrations and PgDb against a real Postgres, driven by the mock engines.
    # Uses the Postgres preinstalled on the runner: a Docker Hub service image
    # hit the anonymous pull rate limit on the first run.
    runs-on: ubuntu-latest
    env:
      PGPASSWORD: postgres
      PG_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Start Postgres
        run: |
          sudo systemctl start postgresql.service
          pg_isready --timeout=30
          sudo -u postgres psql -c "alter user postgres password 'postgres'"
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:pg

  cloudflare:
    # The Cloudflare build (OpenNext) and both Worker bundles, without
    # deploying: a change that breaks them should fail here, not at deploy.
    runs-on: ubuntu-latest
    env:
      VIDALO_MOCK: "1"
      PUBLIC_BASE_URL: https://vidalo-web-preview.julian-devriend.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm cf:build
        working-directory: apps/web
      - run: pnpm exec wrangler deploy --dry-run --env preview --outdir ../../out/cf-web
        working-directory: apps/web
      - run: ../web/node_modules/.bin/wrangler deploy --dry-run --outdir ../../out/cf-worker
        working-directory: apps/worker

  browser:
    # The Playwright suites against a production build (next start), in mock
    # mode and behind the launch gate. Added 23 Oct 2026 after a language
    # switch and a Dutch form bubble reached vidalo.io because no test ran in
    # CI (Control Room I2, I7).
    runs-on: ubuntu-latest
    env:
      VIDALO_MOCK: "1"
      E2E_SERVER: start
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm --filter @vidalo/web build
      - run: pnpm e2e
      - run: pnpm e2e:gate
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: out/playwright-report
          retention-days: 7
